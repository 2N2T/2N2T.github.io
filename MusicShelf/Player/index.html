<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Music Player</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="music-player.css">
    </head>
    <body>
        <div id="music-player">
            <div id="vinyl-div">
                <img id="vinyl-spin" draggable="false" src="./vinyl_body.png">
                <img id="vinyl-inner" draggable="false" src="./vinyl_spin.png">
            </div>
            
            <div id="song-name">Song</div>
            <div id="song-artist">Artist</div>

            <input id="slider-song" type="range">

            <div id="music-buttons">
                <i id="prev-song" class="fa-solid fa-backward-step fa-2x"></i>
                <i id="playpause-song" class="fa-solid fa-circle-play fa-3x"></i>
                <i id="next-song" class="fa-solid fa-forward-step fa-2x"></i>

                <div class="volume-group">
                <i id="volume-btn" class="bi bi-volume-off-fill" style="font-size: 40px; color: gray;"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8">
                </div>
            </div>
            

        </div>
        <script src="music-player.js"></script>
    </body>
</html>
